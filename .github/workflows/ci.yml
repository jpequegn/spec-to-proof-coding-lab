name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: "SpecToProof"
          axiom-audit: true
          axiom-audit-root: "SpecToProof"
          use-mathlib-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked --no-editable
      - run: uv run ruff check .
      - run: uv run pytest
