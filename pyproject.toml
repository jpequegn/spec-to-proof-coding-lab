[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spec-to-proof-coding-lab"
version = "0.1.0"
description = "Lean4 contracts and proof evidence for small generated implementations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Julien Pequegnot" }]
dependencies = []

[project.scripts]
spec-to-proof = "spec_to_proof.cli:main"

[dependency-groups]
dev = [
  "coverage>=7.10,<8",
  "hypothesis>=6.138,<7",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spec_to_proof"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
source = ["spec_to_proof"]

[tool.coverage.report]
show_missing = true
